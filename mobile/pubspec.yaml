name: power_iot_app
description: Power IoT System Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  device_preview: ^1.1.0

  # --- 核心架構 ---
  # 狀態管理 (Riverpod 最新版)
  flutter_riverpod: ^2.5.1
  # 路由管理 (升級到 v14，API 更穩定)
  go_router: ^14.2.0
  # 網路請求
  dio: ^5.5.0
  # 本地儲存 (存 Token)
  shared_preferences: ^2.2.3
  
  # --- UI 相關 ---
  # 字型
  google_fonts: ^6.2.1
  # 圖標 (Material Symbols)
  cupertino_icons: ^1.0.8
  # 處理 SVG 圖片
  flutter_svg: ^2.0.10
  # 處理數據圖表 (儀表板用)
  fl_chart: ^0.68.0

  # --- IoT 相關 (關鍵更新) ---
  # 藍牙 (BLE) - 建議使用較新版以支援 Android 13+
  flutter_blue_plus: ^1.32.0
  # QR Code 掃描 - (v5.x 修復了大量相機問題)
  mobile_scanner: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Lints 規範升級，符合最新 Dart 標準
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # 圖片資源路徑配置
  assets:
    - assets/images/
    - assets/icons/