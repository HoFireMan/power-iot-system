per_listener_settings true

listener 8883
protocol mqtt
allow_anonymous false
cafile /run/power-iot/mosquitto/certs/ca.crt
certfile /run/power-iot/mosquitto/certs/server.crt
keyfile /run/power-iot/mosquitto/certs/server.key
require_certificate false
use_identity_as_username false
password_file /run/power-iot/mosquitto/config/password_file
acl_file /run/power-iot/mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true
