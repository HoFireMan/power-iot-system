# Phase-A PowerIoT-App VM package. Secrets are host-injected at deployment time;
# no secret values or development defaults are present in this file.
services:
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: "no"
    read_only: true
    ports:
      - "${POWERIOT_HTTP_PORT:?set explicit rehearsal/host port}:8081"
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks: [poweriot-app]
    volumes:
      - ${POWERIOT_REVERSE_PROXY_CONFIG:?set host-managed reverse-proxy config}:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/d6/backend.Dockerfile
    restart: "no"
    read_only: true
    networks: [poweriot-app]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      D6_RUNTIME_MODE: ${D6_RUNTIME_MODE:-PRE_CUTOVER}
      D6_BOUNDED_SMOKE: ${D6_BOUNDED_SMOKE:-0}
      DATABASE_URL: ${APPLICATION_DATABASE_URL:?set externally injected application endpoint}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:?set externally injected MQTTS endpoint}
      MQTT_CA_FILE: /run/poweriot/secrets/mqtt-ca.crt
      MQTT_USERNAME_FILE: /run/poweriot/secrets/mqtt-username
      MQTT_PASSWORD_FILE: /run/poweriot/secrets/mqtt-password
      D6_SECRET_SOURCE: HOST_MANAGED_EXTERNALLY_INJECTED_RESTRICTED_SECRETS
    volumes:
      - ${POWERIOT_BACKEND_SECRET_DIR:?set restricted host secret directory}:/run/poweriot/secrets:ro
    depends_on:
      mqtt:
        condition: service_started

  mqtt:
    image: eclipse-mosquitto:2
    restart: "no"
    read_only: true
    networks: [poweriot-app]
    ports:
      - "${MQTT_TLS_PORT:?set explicit rehearsal/host port}:8883"
    volumes:
      - ${POWERIOT_MQTT_CONFIG:?set host-managed Mosquitto config}:/mosquitto/config:ro
      - ${POWERIOT_MQTT_CERT_DIR:?set host-managed MQTTS certificate directory}:/mosquitto/certs:ro
      - ${POWERIOT_MQTT_DATA_DIR:?set isolated broker data directory}:/mosquitto/data

  d1l-authority:
    build:
      context: ../..
      dockerfile: infrastructure/d6/control-plane.Dockerfile
    restart: "no"
    read_only: true
    ports:
      - "${D1L_TLS_PORT:?set explicit rehearsal/host port}:8443"
    networks: [poweriot-app]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      D1L_PROVIDER_DATABASE_URL: ${D1L_PROVIDER_DATABASE_URL:?set externally injected provider endpoint}
      D1L_PROVIDER_TLS_CERT_FILE: /run/poweriot/secrets/provider.crt
      D1L_PROVIDER_TLS_KEY_FILE: /run/poweriot/secrets/provider.key
      D1L_PROVIDER_TLS_CA_FILE: /run/poweriot/secrets/provider-ca.crt
      D1L_SECRET_SOURCE: HOST_MANAGED_EXTERNALLY_INJECTED_RESTRICTED_SECRETS
    volumes:
      - ${POWERIOT_D1L_SECRET_DIR:?set restricted host D1-L secret directory}:/run/poweriot/secrets:ro

networks:
  poweriot-app:
    name: ${POWERIOT_APP_NETWORK:?set isolated App-VM network name}
